<style>

    width: 1200px; height: 630px;

  <!-- left: ATM -->
  <path d="M62 160 C 62 148, 70 142, 84 142 L 400 143 C 414 142, 422 150, 421 162 L 422 262 C 423 276, 414 282, 400 281 L 82 280 C 68 281, 61 274, 62 260 Z"

  <text class="t" x="86" y="234" font-size="17" fill="#c07f0d">WaitMessage: "9 min" / "in arrivo"</text>
  <text class="t" x="86" y="260" font-size="16" fill="#6b6b70">被 Akamai 擋 → 換成瀏覽器 UA + Referer</text>

  <path d="M62 306 C 62 294, 70 288, 84 288 L 400 289 C 414 288, 422 296, 421 308 L 422 400 C 423 414, 414 420, 400 419 L 82 418 C 68 419, 61 412, 62 398 Z"

  <text class="t" x="86" y="354" font-size="16" fill="#6b6b70">整站時刻表，抓 60 筆</text>
  <text class="t" x="86" y="380" font-size="16" fill="#6b6b70">用線路 15 + headsign 篩出我要的方向</text>
  <text class="t" x="86" y="404" font-size="16" fill="#6b6b70">ATM 掛掉時，這邊還撐得住</text>

  <path d="M430 210 C 468 204, 480 240, 516 250" stroke="#3b3b40" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M430 352 C 468 346, 480 316, 516 306" stroke="#3b3b40" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>

  <path d="M526 190 C 526 176, 536 169, 552 169 L 890 170 C 906 169, 915 178, 914 192 L 915 380 C 916 396, 906 403, 890 402 L 550 401 C 534 402, 525 394, 526 380 Z"

  <text class="t" x="550" y="244" font-size="17" fill="#1b1b1f">第一班 ← 看板的即時等待時間</text>
  <text class="t" x="550" y="270" font-size="16" fill="#6b6b70">（延誤已經算在裡面了）</text>

  <text class="t" x="550" y="388" font-size="17" fill="#1b1b1f">其餘班次 ← 時刻表，排序後取四筆</text>

  <path d="M924 290 C 954 284, 966 296, 996 290" stroke="#3b3b40" stroke-width="2.6" fill="none" marker-end="url(#arrow)"/>

  <path d="M1006 196 C 1006 186, 1013 181, 1024 181 L 1146 182 C 1157 181, 1164 188, 1163 198 L 1164 384 C 1165 396, 1157 401, 1146 400 L 1022 399 C 1011 400, 1004 394, 1005 382 Z"

  <text class="t" x="1022" y="248" font-size="17" fill="#c0392b">23:52 +4 ●</text>

  <text class="t" x="1022" y="306" font-size="17" fill="#2e8b4f">00:18</text>
  <text class="t" x="1022" y="334" font-size="17" fill="#2e8b4f">00:33</text>
  <text class="t" x="1018" y="368" font-size="14" fill="#8a8a90">● = 來自看板</text>

  <path d="M62 448 C 62 436, 70 430, 84 430 L 560 431 C 574 430, 582 438, 581 450 L 582 552 C 583 566, 574 572, 560 571 L 82 570 C 68 571, 61 564, 62 550 Z"
        fill="#ffffff" stroke="#3b3b40" stroke-width="2.6"/>

  <text class="t" x="86" y="500" font-size="17" fill="#c0392b">紅：剩下時間 ≤ 走路 4 分鐘 → 放棄</text>
  <text class="t" x="86" y="528" font-size="17" fill="#c07f0d">橘：4 到 8 分鐘 → 現在就出門</text>
  <text class="t" x="86" y="556" font-size="17" fill="#2e8b4f">綠：還有時間</text>

  <path d="M604 480 C 604 470, 611 465, 622 465 L 1000 466 C 1011 465, 1018 472, 1017 482 L 1018 552 C 1019 564, 1011 569, 1000 568 L 620 567 C 609 568, 602 562, 603 550 Z"

  <text class="t" x="624" y="526" font-size="16" fill="#5a7296">是「我現在該不該起身」</text>
  <text class="t" x="624" y="552" font-size="16" fill="#5a7296">走路時間寫死在設定裡，剩下交給顏色</text>

  <text class="t" x="1000" y="600" font-size="18" fill="#8a8a90">reallyniceday.com</text>
